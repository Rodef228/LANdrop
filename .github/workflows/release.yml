name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin
            arch: amd64
            ext: ''
          - target: darwin
            arch: arm64
            ext: ''
          - target: linux
            arch: amd64
            ext: ''
          - target: linux
            arch: arm64
            ext: ''
          - target: windows
            arch: amd64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        shell: bash
        run: |
          BINARY="landrop-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.ext }}"
          CGO_ENABLED=0 GOOS=${{ matrix.target }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w" -o "$BINARY" ./cmd/node/
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          echo "Built: $BINARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: landrop-${{ matrix.target }}-${{ matrix.arch }}
          path: landrop-${{ matrix.target }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          shasum -a 256 landrop-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LANdrop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/landrop-*
            dist/checksums.txt